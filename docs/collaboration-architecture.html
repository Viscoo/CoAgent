<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CoAgent 协作架构</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f5f7fa;
    --border: #dde3eb;
    --text: #1f2937;
    --muted: #5b6b7c;
    --dim: #8a94a3;
    --blue: #1f5fa8;
    --teal: #0e7c7b;
    --gold: #b7791f;
    --red: #c0392b;
    --chipbg: #eaf1fa;
    --chipbd: #b9cde6;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  main {
    max-width: 1020px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .note {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 18px 0;
    color: var(--muted);
    font-size: 13px;
  }
  .note b { color: var(--text); }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 18px; font-weight: 650; fill: var(--text); }
  .label { font-size: 13px; font-weight: 600; fill: var(--text); }
  .small { font-size: 11.5px; fill: var(--muted); }
  .node { stroke: var(--border); stroke-width: 1; rx: 7; ry: 7; }
  .panel { fill: var(--panel); }
  .blue { fill: var(--chipbg); stroke: var(--chipbd); }
  .bluefill { fill: var(--blue); stroke: none; }
  .teal { fill: var(--teal); stroke: none; }
  .goldline { fill: none; stroke: var(--gold); stroke-width: 1.5; }
  .edge { stroke: var(--border); stroke-width: 1.5; fill: none; }
  .edge-strong { stroke: var(--blue); stroke-width: 1.5; fill: none; }
  .edge-teal { stroke: var(--teal); stroke-width: 1.5; fill: none; }
  .edge-dash { stroke: var(--dim); stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
  .zone { fill: none; stroke: var(--dim); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.55; }
  .tag {
    font-size: 10px; font-weight: 600; fill: #fff;
  }
  .wtag { fill: var(--gold); font-size: 10.5px; font-weight: 600; }
</style>
<main>
  <h1>CoAgent 协作架构</h1>
  <p class="sub">多 Agent 编排层 · 每个 CLI 窗口都能看到其他 Agent 在做什么（实时状态广播）</p>

  <div class="note">
    <b>核心思路：</b>OpenCode / Claude Code 负责执行，CoAgent 在它上面加一层工程化护栏——
    任务图拆解、6 角色分工、权限守卫、审查关卡、运行账本，以及跨窗口的实时协作（Hub）。
    <b>每个窗口跑任务时，会把「角色 + 当前任务」实时广播给 Hub，其他窗口立即可见。</b>
  </div>

  <svg viewBox="0 0 940 700" xmlns="http://www.w3.org/2000/svg">
    <!-- Zones -->
    <rect class="zone" x="20" y="20" width="290" height="620" />
    <text class="small" x="30" y="38">Agent A（终端窗口）</text>

    <rect class="zone" x="330" y="20" width="290" height="620" />
    <text class="small" x="340" y="38">Agent B（终端窗口）</text>

    <rect class="zone" x="640" y="20" width="280" height="620" />
    <text class="small" x="650" y="38">CoAgent Hub（协作层）</text>

    <!-- Agent A Boxes -->
    <rect class="node blue" x="45" y="58" width="120" height="42" />
    <text class="label" x="105" y="85" text-anchor="middle">🛡️ PolicyGuard</text>

    <rect class="node blue" x="175" y="58" width="120" height="42" />
    <text class="label" x="235" y="85" text-anchor="middle">📋 Orchestrator</text>

    <rect class="node panel" x="45" y="116" width="120" height="42" />
    <text class="label" x="105" y="143" text-anchor="middle">🧠 OpenCode</text>

    <rect class="node panel" x="175" y="116" width="120" height="42" />
    <text class="label" x="235" y="143" text-anchor="middle">🔗 Adapter</text>

    <!-- Agent A Status -->
    <rect class="node panel" x="45" y="182" width="250" height="108" />
    <text class="label" x="170" y="204" text-anchor="middle">📊 实时状态</text>
    <text class="small" x="60" y="224">agent: planner</text>
    <text class="small" x="60" y="242">goal: 重构 API 接口</text>
    <text class="small" x="60" y="260">status: ▶ 忙碌</text>
    <text class="small" x="60" y="278">task: 拆解任务图</text>

    <!-- Agent A Broadcast -->
    <rect class="node teal" x="45" y="310" width="250" height="58" />
    <text class="tag" x="170" y="338" text-anchor="middle">📡 状态广播（peer.update）</text>
    <text class="small" x="60" y="356" fill="#fff">role + currentTask → Hub</text>

    <!-- Agent A Ledger -->
    <rect class="node panel" x="45" y="388" width="250" height="58" />
    <text class="label" x="170" y="412" text-anchor="middle">🗂️ RunLedger</text>
    <text class="small" x="60" y="430">.coagent/runs/&lt;id&gt;/run.json</text>

    <!-- Agent B Boxes -->
    <rect class="node blue" x="355" y="58" width="120" height="42" />
    <text class="label" x="415" y="85" text-anchor="middle">🛡️ PolicyGuard</text>

    <rect class="node blue" x="485" y="58" width="120" height="42" />
    <text class="label" x="545" y="85" text-anchor="middle">📋 Orchestrator</text>

    <rect class="node panel" x="355" y="116" width="120" height="42" />
    <text class="label" x="415" y="143" text-anchor="middle">🧠 Claude Code</text>

    <rect class="node panel" x="485" y="116" width="120" height="42" />
    <text class="label" x="545" y="143" text-anchor="middle">🔗 Adapter</text>

    <!-- Agent B Status -->
    <rect class="node panel" x="355" y="182" width="250" height="108" />
    <text class="label" x="480" y="204" text-anchor="middle">📊 实时状态</text>
    <text class="small" x="370" y="224">agent: implementer</text>
    <text class="small" x="370" y="242">goal: 实现登录模块</text>
    <text class="small" x="370" y="260">status: ▶ 忙碌</text>
    <text class="small" x="370" y="278">task: 编写 auth.ts</text>

    <!-- Agent B Broadcast -->
    <rect class="node teal" x="355" y="310" width="250" height="58" />
    <text class="tag" x="480" y="338" text-anchor="middle">📡 状态广播（peer.update）</text>
    <text class="small" x="370" y="356" fill="#fff">role + currentTask → Hub</text>

    <!-- Agent B Ledger -->
    <rect class="node panel" x="355" y="388" width="250" height="58" />
    <text class="label" x="480" y="412" text-anchor="middle">🗂️ RunLedger</text>
    <text class="small" x="370" y="430">.coagent/runs/&lt;id&gt;/run.json</text>

    <!-- Cross-window visibility note -->
    <rect class="node goldline" x="45" y="470" width="560" height="120" />
    <text class="title" x="60" y="500" fill="#b7791f">👀 互相看得见</text>
    <text class="small" x="60" y="522">B 窗口（TUI 侧边栏 Ctrl+B / /peers / coagent ps）实时看到：</text>
    <text class="small" x="60" y="542">· A 正在「planner: 拆解任务图」 ▶ 忙碌</text>
    <text class="small" x="60" y="560">· A 完成后自动回到 ○ 空闲</text>
    <text class="small" x="60" y="578">· A 下线 → 自动移除（45s 心跳超时）</text>

    <!-- Hub -->
    <rect class="node blue" x="665" y="58" width="230" height="42" />
    <text class="label" x="780" y="85" text-anchor="middle">🌐 WebSocket 服务 :4876</text>

    <rect class="node panel" x="665" y="118" width="230" height="88" />
    <text class="label" x="780" y="140" text-anchor="middle">🗺️ Agent 注册表</text>
    <text class="small" x="680" y="160">A (planner) · B (implementer)</text>
    <text class="small" x="680" y="178">C (reviewer) · …</text>

    <rect class="node panel" x="665" y="224" width="230" height="88" />
    <text class="label" x="780" y="246" text-anchor="middle">📬 消息路由</text>
    <text class="small" x="680" y="266">agent.message（私信）</text>
    <text class="small" x="680" y="284">agent.broadcast（广播）</text>

    <rect class="node panel" x="665" y="330" width="230" height="66" />
    <text class="label" x="780" y="352" text-anchor="middle">💓 心跳 &amp; 超时</text>
    <text class="small" x="680" y="372">15s 检查 · 45s 离线判定</text>

    <rect class="node teal" x="665" y="414" width="230" height="58" />
    <text class="tag" x="780" y="442" text-anchor="middle">📡 事件分发</text>
    <text class="small" x="680" y="460" fill="#fff">peer.join / update / leave</text>

    <rect class="node panel" x="665" y="490" width="230" height="60" />
    <text class="label" x="780" y="512" text-anchor="middle">🌱 未来扩展</text>
    <text class="small" x="680" y="532">共享知识库 · Agent 市场 · 持久化</text>

    <!-- Arrows: Agent to Hub -->
    <line class="edge-teal" x1="295" y1="339" x2="330" y2="339" />
    <polygon fill="#0e7c7b" points="330,334 342,339 330,344" />

    <line class="edge-teal" x1="605" y1="339" x2="640" y2="339" />
    <polygon fill="#0e7c7b" points="640,334 652,339 640,344" />

    <!-- Hub internal arrows -->
    <line class="edge" x1="780" y1="100" x2="780" y2="118" />
    <polygon fill="#dde3eb" points="775,118 780,130 785,118" />

    <line class="edge" x1="780" y1="206" x2="780" y2="224" />
    <polygon fill="#dde3eb" points="775,224 780,236 785,224" />

    <line class="edge" x1="780" y1="312" x2="780" y2="330" />
    <polygon fill="#dde3eb" points="775,330 780,342 785,330" />

    <line class="edge" x1="780" y1="396" x2="780" y2="414" />
    <polygon fill="#dde3eb" points="775,414 780,426 785,414" />

    <!-- Agent internal arrows -->
    <line class="edge" x1="165" y1="79" x2="175" y2="79" />
    <line class="edge" x1="105" y1="100" x2="105" y2="116" />
    <polygon fill="#dde3eb" points="100,116 105,128 110,116" />

    <line class="edge" x1="235" y1="100" x2="235" y2="116" />
    <polygon fill="#dde3eb" points="230,116 235,128 240,116" />

    <!-- Pipeline footer -->
    <rect class="node panel" x="45" y="612" width="875" height="0" />

    <line class="edge" x1="45" y1="622" x2="900" y2="622" stroke="#dde3eb" stroke-width="1.5" />

    <!-- Pipeline boxes -->
    <g font-size="11.5" font-weight="600" text-anchor="middle">
      <rect class="node blue" x="45" y="636" width="104" height="34" /><text fill="#1f5fa8" x="97" y="658">Planner</text>
      <rect class="node blue" x="161" y="636" width="104" height="34" /><text fill="#1f5fa8" x="213" y="658">Explorer</text>
      <rect class="node blue" x="277" y="636" width="112" height="34" /><text fill="#1f5fa8" x="333" y="658">Implementer</text>
      <rect class="node blue" x="401" y="636" width="100" height="34" /><text fill="#1f5fa8" x="451" y="658">Reviewer</text>
      <rect class="node blue" x="513" y="636" width="100" height="34" /><text fill="#1f5fa8" x="563" y="658">Tester</text>
      <rect class="node blue" x="625" y="636" width="112" height="34" /><text fill="#1f5fa8" x="681" y="658">Integrator</text>
      <rect class="node teal" x="749" y="636" width="128" height="34" /><text fill="#ffffff" x="813" y="658">MergeGate</text>
    </g>
    <text class="small" x="45" y="690">6 角色流水线：目标 → 任务图 → 分工 → 审查/测试关卡 → 合并交付</text>
  </svg>
</main>
